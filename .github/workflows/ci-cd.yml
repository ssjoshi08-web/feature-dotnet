# ============================================================================
# CI/CD Pipeline — Provider-Agnostic AI Review
# ============================================================================
# Stages: Build → Test → Trivy Scan → AI Review → Deploy
#
# Runs on a self-hosted Ubuntu runner with the labels [self-hosted, ubuntu, dotnet].
# This workflow NEVER references a specific AI provider — provider selection
# is driven entirely by config/ai-config.yml.
# ============================================================================
name: ci-cd

on:
  push:
    branches: [main, develop, 'feature/*', 'release/*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

env:
  DOTNET_VERSION: '8.0.x'
  AI_CONFIG: config/ai-config.yml
  COVERAGE_THRESHOLD_PCT: 60

jobs:
  # --------------------------------------------------------------------------
  # 1. Build
  # --------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Create solution
        run: |
          if [ ! -f UserApi.sln ]; then
            dotnet new sln -n UserApi
            find . -name "*.csproj" -not -path "./samples/*" -exec dotnet sln add {} \;
          fi

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore --configuration Release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            src/UserApi/bin/Release/**/*.dll
            src/UserApi/bin/Release/**/*.deps.json
          if-no-files-found: ignore
          retention-days: 7

  # --------------------------------------------------------------------------
  # 2. Test (+ coverage)
  # --------------------------------------------------------------------------
  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Create solution
        run: |
          if [ ! -f UserApi.sln ]; then
            dotnet new sln -n UserApi
            find . -name "*.csproj" -not -path "./samples/*" -exec dotnet sln add {} \;
          fi

      - name: Restore
        run: dotnet restore

      - name: Run tests with coverage (Cobertura)
        run: |
          dotnet test \
            --no-restore \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            --logger "trx;LogFileName=test-results.trx" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Locate Cobertura report
        id: locate
        run: |
          REPORT=$(find coverage -name "coverage.cobertura.xml" | head -n 1)
          if [[ -z "${REPORT}" ]]; then
            echo "::error::No coverage.cobertura.xml found under ./coverage"
            exit 1
          fi
          echo "report=${REPORT}" >> "$GITHUB_OUTPUT"
          echo "Found report: ${REPORT}"

      - name: "Enforce coverage threshold (>= ${{ env.COVERAGE_THRESHOLD_PCT }}%)"
        run: |
          REPORT="${{ steps.locate.outputs.report }}"
          # Use sed instead of grep -P because GNU grep rejects variable-length
          # lookbehinds like `(?<=<coverage[^>]*line-rate=")`.
          LINE_RATE=$(sed -n 's/.*<coverage[^>]*line-rate="\([0-9.]*\)".*/\1/p' "${REPORT}" | head -n 1)
          BRANCH_RATE=$(sed -n 's/.*<coverage[^>]*branch-rate="\([0-9.]*\)".*/\1/p' "${REPORT}" | head -n 1)
          echo "line-rate=${LINE_RATE}  branch-rate=${BRANCH_RATE}"
          THRESHOLD="${{ env.COVERAGE_THRESHOLD_PCT }}"
          awk -v lr="${LINE_RATE}" -v thr="$(echo "${THRESHOLD}/100" | bc -l)" \
              'BEGIN { exit (lr+0 < thr+0) ? 1 : 0 }' \
              || { echo "::error::Line coverage ${LINE_RATE} below threshold ${THRESHOLD}%"; exit 1; }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/**/*
            tests/UserApi.Tests/TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 30

  # --------------------------------------------------------------------------
  # 3. Trivy Security Scan
  # --------------------------------------------------------------------------
  trivy-scan:
    name: Trivy Security Scan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy FS SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Run Trivy IaC scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-iac.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy IaC SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac

  # --------------------------------------------------------------------------
  # 4. AI Review Agent (provider-agnostic)
  # --------------------------------------------------------------------------
  ai-review:
    name: AI Review Agent
    needs: [build, test, trivy-scan]
    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install runtime dependencies
        run: |
          # ubuntu-latest ships with jq, curl, python3, python3-yaml, and bc.
          # If any tool is missing, install it here without sudo (apt-get fails
          # under the default GITHUB_TOKEN user, so fall back to pip or skip).
          command -v jq >/dev/null || (echo "jq missing"; exit 1)
          command -v python3 >/dev/null || (echo "python3 missing"; exit 1)
          command -v bc >/dev/null || (echo "bc missing"; exit 1)

      - name: Make review scripts executable
        run: |
          chmod +x ./scripts/run-review.sh
          chmod +x ./scripts/providers/*.sh || true

      # All provider secrets are declared at the workflow level, but no
      # provider-specific code consumes them. The active provider is
      # selected by config/ai-config.yml — the orchestrator dispatches.
      - name: Run AI Review Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NVIDIA_API_KEY:    ${{ secrets.NVIDIA_API_KEY }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_KEY:  ${{ secrets.AZURE_OPENAI_KEY }}
        run: |
          set -e
          ./scripts/run-review.sh

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-report
          path: |
            review-artifacts/review-report.json
            review-artifacts/review-summary.md
          if-no-files-found: warn
          retention-days: 30

      - name: Comment PR with review summary
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'review-artifacts/review-summary.md';
            if (!fs.existsSync(path)) {
              console.log('No review-summary.md produced.');
              return;
            }
            const body = fs.readFileSync(path, 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

  # --------------------------------------------------------------------------
  # 5. Deploy
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: [build, test, trivy-scan, ai-review]
    if: |
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) &&
      needs.ai-review.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: dotnet publish src/UserApi/UserApi.csproj --configuration Release --output ./publish

      - name: Deploy
        run: |
          echo "Deploying application..."
          # Replace with the deployment action for your platform
          # (Azure Web Apps, AWS ECS, Kubernetes, etc.).
          ls -la ./publish

      - name: Notify deployment
        if: always()
        run: |
          echo "Deployment status: ${{ job.status }}"
