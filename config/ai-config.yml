# ============================================================================
# AI Review Agent — Provider-Agnostic Configuration
# ============================================================================
# Switch AI providers by changing the `provider:` value below.
# No pipeline, workflow, or skill change is required.
# ============================================================================

agent:
  name: "AI Review Agent"
  version: "1.0.0"
  description: "Provider-agnostic code, security, testing, and architecture review."

# ---------------------------------------------------------------------------
# Active provider — change this single value to switch AI backends.
# ---------------------------------------------------------------------------
provider: claude   # one of: claude | nvidia | ollama | openai | azure

# ---------------------------------------------------------------------------
# Per-provider configuration. Only the block matching `provider:` is used.
# ---------------------------------------------------------------------------
providers:
  claude:
    enabled: true
    model: "claude-opus-4-8"
    endpoint: "https://api.anthropic.com/v1/messages"
    api_key_env: "ANTHROPIC_API_KEY"
    max_tokens: 4096
    temperature: 0.0
    timeout_seconds: 120

  nvidia:
    enabled: true
    model: "meta/llama-3.1-70b-instruct"
    endpoint: "https://integrate.api.nvidia.com/v1/chat/completions"
    api_key_env: "NVIDIA_API_KEY"
    max_tokens: 4096
    temperature: 0.0
    timeout_seconds: 120

  ollama:
    enabled: true
    model: "llama3.1:70b"
    endpoint: "http://localhost:11434/api/chat"
    api_key_env: ""               # Ollama is local — no key required
    max_tokens: 4096
    temperature: 0.0
    timeout_seconds: 180          # local inference can be slower

  openai:
    enabled: true
    model: "gpt-4o"
    endpoint: "https://api.openai.com/v1/chat/completions"
    api_key_env: "OPENAI_API_KEY"
    max_tokens: 4096
    temperature: 0.0
    timeout_seconds: 120

  azure:
    enabled: true
    model: "gpt-4o"
    endpoint: "https://YOUR_RESOURCE.openai.azure.com/openai/deployments/YOUR_DEPLOYMENT/chat/completions?api-version=2024-08-01-preview"
    api_key_env: "AZURE_OPENAI_KEY"
    max_tokens: 4096
    temperature: 0.0
    timeout_seconds: 120
    api_version: "2024-08-01-preview"

# ---------------------------------------------------------------------------
# Supported providers registry — used by validation and `output.tf`.
# ---------------------------------------------------------------------------
supported_providers:
  - claude
  - nvidia
  - ollama
  - openai
  - azure

# ---------------------------------------------------------------------------
# Decision policy — thresholds that determine PASS / FAIL.
# ---------------------------------------------------------------------------
policy:
  fail_on:
    - critical_vulnerability
    - hardcoded_secret
    - coverage_below_threshold
    - high_risk_architecture_issue
  coverage_threshold_pct: 80
  max_critical_findings: 0
  max_high_findings: 0

# ---------------------------------------------------------------------------
# Review scope — what files the AI agent sees.
# ---------------------------------------------------------------------------
scope:
  include_extensions:
    - .cs
    - .java
    - .py
    - .ts
    - .js
    - .go
    - .rb
    - .tf
    - .yml
    - .yaml
    - .json
  exclude_paths:
    - "**/bin/**"
    - "**/obj/**"
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/.git/**"
    - "**/vendor/**"
  max_files_per_review: 500
  max_file_size_kb: 512

# ---------------------------------------------------------------------------
# Output artefacts.
# ---------------------------------------------------------------------------
output:
  report_json: "review-report.json"
  summary_md: "review-summary.md"
  artifacts_dir: "review-artifacts"

# ---------------------------------------------------------------------------
# Review dimensions — toggle individual skills.
# ---------------------------------------------------------------------------
skills:
  security: true
  code_review: true
  testing: true
  architecture: true